name: Deploy to Production

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create SAM S3 bucket if not exists
        run: |
          aws s3 mb s3://7starexperts-sam-production --region ${{ vars.AWS_REGION }} 2>/dev/null || true

      - name: SAM Build
        run: sam build --config-env production
        working-directory: .

      - name: SAM Deploy
        run: sam deploy --config-env production --no-fail-on-empty-changeset
        working-directory: .

      - name: Print API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name 7starexperts-api-production \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text
