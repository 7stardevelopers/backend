name: Deploy to Staging

on:
  push:
    branches: [ main, test_backend ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM Build
        run: sam build --config-env staging

      - name: SAM Deploy
        run: sam deploy --config-env staging --no-fail-on-empty-changeset

      - name: Print stack failure events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name sevenstar-api-staging \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].{Resource:LogicalResourceId,Reason:ResourceStatusReason}" \
            --output table

      - name: Print API URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name sevenstar-api-staging \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text
