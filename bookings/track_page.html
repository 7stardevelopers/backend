<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Live tracking · 7StarExperts</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --fg: #141826; --muted: #5d6478;
    --border: #e3e6ef; --primary: #4f46e5; --live: #16a34a; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1020; --surface: #171b2e; --fg: #eef0f7; --muted: #9aa1b8;
      --border: #262c45; --primary: #818cf8; --live: #22c55e; --warn: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: var(--surface); border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(0,0,0,.12); max-width: 560px; margin: 0 auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .dot.live { background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); } 100% { box-shadow: 0 0 0 10px rgba(34,197,94,0); } }
  h1 { font-size: 22px; margin: 6px 0 2px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0; }
  .meta { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
  .brand { font-weight: 700; color: var(--primary); }
  .pin { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .pin.expert { background: var(--primary); }
  .pin.home { background: #fff; border-color: var(--primary); color: var(--primary); }
  .pin svg { width: 16px; height: 16px; }
  .ended #map { filter: grayscale(.8) opacity(.6); }
</style>
</head>
<body>
<div id="map" role="img" aria-label="Map showing the expert's live location"></div>
<section class="sheet" aria-live="polite">
  <span class="chip"><span class="dot" id="dot"></span><span id="chip">Connecting…</span></span>
  <h1 id="headline">Loading live tracking…</h1>
  <p class="sub" id="sub"></p>
  <div class="meta"><span id="expert"></span><span class="brand">7StarExperts</span></div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  var LINK_ERROR = "__LINK_ERROR__";
  var POLL_MS = 5000, STALE_MS = 60000;
  var $ = function (id) { return document.getElementById(id); };
  var set = function (id, text) { $(id).textContent = text; };

  if (LINK_ERROR) {
    set('chip', 'Unavailable');
    set('headline', LINK_ERROR === 'Link expired' ? 'This tracking link has expired' : 'This tracking link is not valid');
    set('sub', 'Ask for a new link from the 7StarExperts app.');
    return;
  }

  var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([17.7384, 83.32], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);

  var icon = function (cls, svg) {
    return L.divIcon({ className: '', html: '<div class="pin ' + cls + '">' + svg + '</div>', iconSize: [34, 34], iconAnchor: [17, 17] });
  };
  var BIKE = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M5 17a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm14 0a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM13 6h3l3 6h-2.2l-1.3-2.6L13 13H9l3-4-1-3h2z"/></svg>';
  var HOME = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>';
  var expertMarker = null, homeMarker = null, fitted = false;

  var url = location.pathname.replace(/\/page\/?$/, '');
  var STATUS = {
    ACCEPTED: ['Expert assigned', 'Tracking starts when they head out.'],
    EN_ROUTE: ['On the way', ''],
    IN_PROGRESS: ['Work in progress', 'Your expert is on the job.'],
    COMPLETED: ['Service completed', 'This visit has ended.'],
    CANCELLED: ['Booking cancelled', 'This visit was cancelled.'],
  };

  function render(d) {
    var s = STATUS[d.status] || ['Live tracking', ''];
    var who = d.expert ? d.expert.first_name : 'Your expert';
    set('expert', d.expert ? who + ' · ★ ' + d.expert.rating.toFixed(1) + (d.service_name ? ' · ' + d.service_name : '') : (d.service_name || ''));

    var ended = d.status === 'COMPLETED' || d.status === 'CANCELLED';
    document.body.classList.toggle('ended', ended);
    var age = d.location && d.location.updated_at ? Date.now() - Date.parse(d.location.updated_at.replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(d.location.updated_at) ? '' : 'Z')) : null;
    var fresh = age != null && age < STALE_MS;
    $('dot').classList.toggle('live', d.live && fresh);
    set('chip', ended ? 'Ended' : !d.live ? 'Not live yet' : fresh ? 'Live' : age != null ? 'Last seen ' + Math.round(age / 60000) + ' min ago' : 'Waiting for location');

    if (d.status === 'EN_ROUTE' && d.eta) {
      set('headline', who + ' arrives in ~' + d.eta.duration_min + ' min');
      set('sub', d.eta.distance_km.toFixed(1) + ' km away by road');
    } else {
      set('headline', s[0]);
      set('sub', s[1]);
    }

    if (d.destination) {
      var h = [d.destination.lat, d.destination.lng];
      if (!homeMarker) homeMarker = L.marker(h, { icon: icon('home', HOME), title: 'Destination' }).addTo(map);
    }
    if (d.location) {
      var p = [d.location.lat, d.location.lng];
      if (!expertMarker) expertMarker = L.marker(p, { icon: icon('expert', BIKE), title: who }).addTo(map);
      else expertMarker.setLatLng(p);
    } else if (expertMarker && !d.live) {
      map.removeLayer(expertMarker); expertMarker = null;
    }
    var pts = [expertMarker, homeMarker].filter(Boolean).map(function (m) { return m.getLatLng(); });
    if (pts.length && !fitted) {
      if (pts.length === 1) map.setView(pts[0], 15); else map.fitBounds(L.latLngBounds(pts), { padding: [60, 60], paddingBottomRight: [60, 220] });
      fitted = true;
    }
    return ended;
  }

  function poll() {
    fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) {
          set('chip', 'Unavailable');
          set('headline', res.j && res.j.message === 'Link expired' ? 'This tracking link has expired' : 'Tracking unavailable');
          set('sub', 'Ask for a new link from the 7StarExperts app.');
          return;
        }
        if (!render(res.j.data)) setTimeout(poll, POLL_MS);
      })
      .catch(function () { set('chip', 'Reconnecting…'); setTimeout(poll, POLL_MS); });
  }
  poll();
})();
</script>
</body>
</html>
